[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steve-engine"
version = "0.1.0"
description = "Deterministic fact-by-fact checker for mixed-language (Manglish/Hinglish/Arabizi/Taglish) teach-back replies."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "rapidfuzz>=3.5",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["steve_engine*"]

[tool.setuptools.package-data]
steve_engine = ["lexicon.yaml", "fallback_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]

# Samjha lexicon — FACT-BEARING WORDS ONLY, romanized.
#
# Entry fields (flow style, one entry per line):
#   canonical  the headword (romanized)
#   category   number | number_mult | unit | frequency_phrase | timing | duration_unit | negation |
#              action_stop | action_call | action_return | action_continue | action_avoid | travel |
#              symptom | food_relation | filler | currency | weekday | month
#   value      what it means to the engine (number, unit name, tag, ...)
#   variants   common spellings-by-ear (the sound key + fuzzy matcher also catch many more)
# Optional flags:
#   verified: true|false   inherited from the language block; ONLY plain English is true.
#   ambiguous: true        also a common word elsewhere; only counts with same-language support
#   adjacent_only: true    only valid directly before a unit word ("a week")
#   negates: true          the word carries its own negation ("nirthanda" = don't stop)
#   period: true           a 'per day' marker (daily/roz): counts as once a day ONLY if no other frequency was said
#   implicit: N            a counter word that means N when no number accompanies it ("marra")
#   requires_near: [...]   only counts when one of these raw tokens is within 2 tokens ("band karo")
#
# Every non-English entry is `verified: false` until a native speaker signs it off
# (see LEXICON_REVIEW.md, generated by engine/tools/make_lexicon_review.py).
# If we were not sure of a word, we left it out (see DECISIONS.md D6).

version: 1

# language-level config: suffix stripping is data-driven (matcher.py reads this, no per-language if-chains)
#   suffixes:   strings that may be glued to the end of a word ("dalawa"+"ng", "tablet"+"s")
#   min_stem:   shortest stem allowed after stripping
languages:
  en:
    name: English
    verified: true
    suffixes: ["s", "es"]
    min_stem: 3
    entries:
      # numbers
      - {canonical: one, category: number, value: 1, variants: [won]}
      - {canonical: two, category: number, value: 2}
      - {canonical: three, category: number, value: 3}
      - {canonical: four, category: number, value: 4}
      - {canonical: five, category: number, value: 5}
      - {canonical: six, category: number, value: 6}
      - {canonical: seven, category: number, value: 7}
      - {canonical: eight, category: number, value: 8}
      - {canonical: nine, category: number, value: 9}
      - {canonical: ten, category: number, value: 10}
      - {canonical: eleven, category: number, value: 11}
      - {canonical: twelve, category: number, value: 12}
      - {canonical: fifteen, category: number, value: 15}
      - {canonical: twenty, category: number, value: 20}
      - {canonical: thirty, category: number, value: 30}
      - {canonical: forty, category: number, value: 40}
      - {canonical: fifty, category: number, value: 50}
      - {canonical: sixty, category: number, value: 60}
      - {canonical: hundred, category: number_mult, value: 100}
      - {canonical: half, category: number, value: 0.5}
      - {canonical: a, category: number, value: 1, adjacent_only: true}
      - {canonical: an, category: number, value: 1, adjacent_only: true}
      # dose units
      - {canonical: tablet, category: unit, value: tablet, variants: [tab, tabs, pill, pills, tablets]}
      - {canonical: capsule, category: unit, value: capsule, variants: [capsules, cap, caps]}
      - {canonical: ml, category: unit, value: ml, variants: [mls, milliliter, millilitre, milliliters, millilitres]}
      - {canonical: spoon, category: unit, value: spoon, variants: [teaspoon, tablespoon, tsp, tbsp, spoonful, spoonfuls]}
      - {canonical: drop, category: unit, value: drop, variants: [drops]}
      - {canonical: puff, category: unit, value: puff, variants: [puffs]}
      - {canonical: bottle, category: unit, value: bottle, variants: [bottles]}
      - {canonical: photo, category: unit, value: photo, variants: [photos, picture, pictures, passport-photo]}
      - {canonical: form, category: unit, value: form, variants: [forms]}
      - {canonical: copy, category: unit, value: copy, variants: [copies]}
      # frequency
      - {canonical: once, category: frequency_phrase, value: 1}
      - {canonical: twice, category: frequency_phrase, value: 2}
      - {canonical: thrice, category: frequency_phrase, value: 3}
      - {canonical: times, category: frequency_phrase, value: counter, variants: [time, x]}
      - {canonical: every, category: frequency_phrase, value: every, variants: [each]}
      - {canonical: daily, category: frequency_phrase, value: 1, period: true, variants: [everyday]}
      - {canonical: alternate, category: frequency_phrase, value: 0.5, variants: ["every other day", "alternate days", "alternate day"]}
      # timing
      - {canonical: morning, category: timing, value: morning, variants: [mornings]}
      - {canonical: noon, category: timing, value: noon, variants: [midday, lunchtime]}
      - {canonical: afternoon, category: timing, value: afternoon, variants: [afternoons]}
      - {canonical: evening, category: timing, value: evening, variants: [evenings]}
      - {canonical: night, category: timing, value: night, variants: [nights, tonight]}
      - {canonical: bedtime, category: timing, value: bedtime, variants: ["bed time", "before bed", "at bedtime", "before sleeping"]}
      - {canonical: "empty stomach", category: timing, value: empty_stomach, variants: ["empty stomache", "fasting"]}
      # food relation
      - {canonical: after, category: food_relation, value: after}
      - {canonical: before, category: food_relation, value: before}
      - {canonical: food, category: food_relation, value: food, variants: [meal, meals, eating, eat, lunch, dinner, breakfast]}
      # duration units
      - {canonical: day, category: duration_unit, value: day, variants: [days]}
      - {canonical: week, category: duration_unit, value: week, variants: [weeks, wk, wks]}
      - {canonical: month, category: duration_unit, value: month, variants: [months]}
      - {canonical: hour, category: duration_unit, value: hour, variants: [hours, hr, hrs]}
      - {canonical: minute, category: duration_unit, value: minute, variants: [minutes, min, mins]}
      # negation
      - {canonical: "no", category: negation, value: true, variants: [nope]}
      - {canonical: not, category: negation, value: true}
      - {canonical: "don't", category: negation, value: true, variants: [dont, "do not", "dont't", "doesn't", "doesnt", "shouldn't", "shouldnt", "mustn't", "mustnt", "never", dnt, donot, "do nt", didnt, "didn't", "did not", dontt, dnt, "wont", "won't"]}
      # SMS negators that are also ordinary words elsewhere ("dun" = Tagalog "there"): only count right next to an English verb
      - {canonical: nt, category: negation, value: true, requires_near: [stop, stp, take, taking, continue, call, eat, go, travel, use, drink, give, keep], variants: [dun, dn]}
      # actions
      - {canonical: stop, category: action_stop, value: stop, variants: [stopping, stopped, discontinue, quit]}
      - {canonical: call, category: action_call, value: call, variants: [phone, contact, inform, tell, calling, informing]}
      - {canonical: "come back", category: action_return, value: come_back, variants: [return, "go back", revisit]}
      - {canonical: continue, category: action_continue, value: continue, variants: ["keep taking", "carry on", continuing]}
      - {canonical: travel, category: travel, value: travel, variants: [travelling, traveling, travels]}
      # symptoms
      - {canonical: rash, category: symptom, value: rash, variants: [rashes, rasch]}
      - {canonical: dizzy, category: symptom, value: dizzy, variants: [dizziness, dizzi, dizy, faint, fainting]}
      - {canonical: fever, category: symptom, value: fever, variants: [temperature]}
      - {canonical: vomiting, category: symptom, value: vomiting, variants: [vomit, vomitting, nausea]}
      - {canonical: itching, category: symptom, value: itching, variants: [itch, itchy]}
      - {canonical: swelling, category: symptom, value: swelling, variants: [swollen, swell]}
      - {canonical: pain, category: symptom, value: pain, variants: [painful]}
      - {canonical: headache, category: symptom, value: headache}
      - {canonical: bleeding, category: symptom, value: bleeding, variants: [bleed]}
      # currency
      - {canonical: aed, category: currency, value: AED, variants: [dirham, dirhams, dhs, dh, durham]}
      - {canonical: rupees, category: currency, value: INR, variants: [rupee, rs, inr]}
      - {canonical: peso, category: currency, value: PHP, variants: [pesos, php]}
      # weekdays
      - {canonical: monday, category: weekday, value: monday, variants: [mon]}
      - {canonical: tuesday, category: weekday, value: tuesday, variants: [tue, tues]}
      - {canonical: wednesday, category: weekday, value: wednesday, variants: [wed]}
      - {canonical: thursday, category: weekday, value: thursday, variants: [thu, thur, thurs]}
      - {canonical: friday, category: weekday, value: friday, variants: [fri]}
      - {canonical: saturday, category: weekday, value: saturday}
      - {canonical: sunday, category: weekday, value: sunday}
      # months
      - {canonical: january, category: month, value: 1, variants: [jan]}
      - {canonical: february, category: month, value: 2, variants: [feb]}
      - {canonical: march, category: month, value: 3}
      - {canonical: april, category: month, value: 4, variants: [apr]}
      - {canonical: june, category: month, value: 6, variants: [jun]}
      - {canonical: july, category: month, value: 7, variants: [jul]}
      - {canonical: august, category: month, value: 8, variants: [aug]}
      - {canonical: september, category: month, value: 9, variants: [sep, sept]}
      - {canonical: october, category: month, value: 10, variants: [oct]}
      - {canonical: november, category: month, value: 11, variants: [nov]}
      - {canonical: december, category: month, value: 12, variants: [dec]}
      # fillers (skipped when measuring "how close" two words are)
      - {canonical: the, category: filler, value: true, variants: [of, and, to, your, you, i, my, will, is, are, in, "on", at, for, with, this, that, it, its, be, take, taking, took, need, should, must, please, ok, okay]}


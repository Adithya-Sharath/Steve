name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-api:
    name: engine + api (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            api/pyproject.toml
      - name: Install (no API keys anywhere in CI)
        run: pip install -e "engine[dev]" -e "api[dev]"
      - name: Lint
        run: ruff check engine api eval tools
      - name: Engine tests
        working-directory: engine
        run: pytest -q
      - name: API tests
        working-directory: api
        run: pytest -q
      - name: STT tooling tests (no network, no audio, no token)
        run: |
          pip install -r tools/requirements.txt
          pytest tools/stt_compare -q

  web:
    name: web (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
